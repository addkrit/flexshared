<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,viewport-fit=cover" />
  <title>Flex Shared</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" />
  <style>
    body { background: #f4f6f8; }
    .hide { display: none !important; }
    .linebg { background: #06c755; color: #fff; }
    .linebg:hover { background: #05b04b; color: #fff; }
    #json { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
    .item-card .name { font-weight: 600; word-break: break-word; }
    .item-card .meta { font-size: 12px; color: #6c757d; }
    .btn-row .btn { margin: 2px 0; }
    #previewFrame { width: 100%; height: 70vh; border: 0; background: #849ebf; }
    .editing { border: 2px solid #ffc107 !important; }
    #status { min-height: 60vh; }
  </style>
</head>

<body>
  <!-- สถานะ/ข้อผิดพลาดตอนเริ่ม -->
  <section id="status" class="d-flex justify-content-center align-items-center p-3">
    <div class="text-center" id="status-box">
      <div class="spinner-border text-success" role="status"></div>
      <p class="mt-2 text-muted" id="status-text">กำลังโหลด...</p>
    </div>
  </section>

  <!-- หน้าหลัก -->
  <main id="app" class="container py-3 hide" style="max-width: 760px;">
    <div class="d-flex align-items-center mb-3">
      <img id="avatar" class="rounded-circle me-2 hide" width="40" height="40" alt="" />
      <div class="h5 mb-0">สวัสดี <span id="displayName"></span></div>
    </div>

    <div class="card shadow-sm mb-3" id="editor-card">
      <div class="card-body">
        <div id="editing-bar" class="alert alert-warning py-2 d-flex justify-content-between align-items-center hide">
          <span>กำลังแก้ไข: <b id="editing-name"></b></span>
          <button class="btn btn-sm btn-outline-dark" id="btn-new">สร้างใหม่</button>
        </div>
        <label for="altText" class="form-label mb-1">ข้อความแสดงแทน Flex (ขึ้นในหน้ารายการแชท)</label>
        <input type="text" class="form-control mb-2" id="altText" maxlength="400" placeholder="FLEX MESSAGE" />
        <label for="json" class="form-label mb-1 d-flex justify-content-between">
          <span>JSON (วางจาก Flex Simulator ได้เลย)</span><small id="size" class="text-muted"></small>
        </label>
        <textarea id="json" rows="12" class="form-control" spellcheck="false"></textarea>
        <div class="text-end mt-2 btn-row">
          <button id="btn-update" class="btn btn-warning hide">อัปเดตรายการนี้</button>
          <button id="btn-save" class="btn btn-primary">บันทึก</button>
          <button id="btn-send" class="btn btn-outline-warning hide">ส่งในห้องแชทนี้</button>
          <button id="btn-share" class="btn btn-success">แชร์ไปห้องแชทอื่น</button>
          <button id="btn-preview" class="btn btn-info">ดูตัวอย่าง</button>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-2">
      <h6 class="mb-0">Flex ที่บันทึกไว้ <span id="count" class="badge bg-secondary"></span></h6>
      <button class="btn btn-sm btn-outline-secondary" id="btn-reload">โหลดใหม่</button>
    </div>
    <div id="list" class="row g-2"></div>
    <p id="list-empty" class="text-muted small hide">ยังไม่มีรายการ — วาง JSON แล้วกด "บันทึก"</p>
  </main>

  <!-- ตัวอย่าง Flex -->
  <div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header py-2">
          <h6 class="modal-title">ตัวอย่าง Flex</h6>
          <button type="button" class="btn btn-sm btn-primary" data-bs-dismiss="modal">ปิด</button>
        </div>
        <div class="modal-body p-0"><iframe id="previewFrame" title="preview"></iframe></div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
  <script>
    const CFG = window.FLEX_CONFIG || {};
    const F2H = 'https://cdn.jsdelivr.net/gh/PamornT/flex2html@2757c2eb8f066387ff33a8d850b3e0a87d1c5d5a';
    const $ = (id) => document.getElementById(id);
    const state = { items: [], editingId: null, canSend: false };
    const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1600, timerProgressBar: true });

    // ---------- เริ่มต้น ----------
    function showStatus(html, spinner) {
      $('status').classList.remove('hide');
      $('app').classList.add('hide');
      $('status-box').innerHTML = (spinner ? '<div class="spinner-border text-success" role="status"></div>' : '') +
        '<div class="mt-2">' + html + '</div>';
    }

    async function main() {
      if (!CFG.LIFF_ID || /ใส่/.test(CFG.LIFF_ID) || !CFG.SCRIPT_URL || /ใส่/.test(CFG.SCRIPT_URL)) {
        return showStatus('<b>ยังไม่ได้ตั้งค่า</b><br>เปิดไฟล์ <code>config.js</code> แล้วใส่ LIFF_ID และ SCRIPT_URL ก่อน');
      }
      try {
        await liff.init({ liffId: CFG.LIFF_ID, withLoginOnExternalBrowser: true });
      } catch (e) {
        return showStatus('<b>เปิด LIFF ไม่สำเร็จ</b><br><small>' + esc(e.message || e) +
          '</small><br><small class="text-muted">เช็กว่า LIFF_ID ถูก และ Endpoint URL ใน LINE Developers ตรงกับที่อยู่หน้านี้</small>');
      }
      const params = new URLSearchParams(location.search);
      if (params.get('liff.state')) return; // LIFF กำลังพาไปหน้าปลายทาง
      if (params.get('flex')) return shareMode(params.get('flex'));
      if (!liff.isLoggedIn()) return liff.login({ redirectUri: location.href });
      if (!liff.getIDToken()) {
        return showStatus('<b>LIFF ยังไม่ได้เปิดสิทธิ์ openid</b><br><small>LINE Developers > LIFF > Scopes: ติ๊ก openid, profile, chat_message.write</small>');
      }
      let name = '', pic = '';
      try { const p = await liff.getProfile(); name = p.displayName; pic = p.pictureUrl || ''; }
      catch (e) { const d = liff.getDecodedIDToken() || {}; name = d.name || 'ผู้ใช้'; pic = d.picture || ''; }
      $('displayName').textContent = name;
      if (pic) { $('avatar').src = pic; $('avatar').classList.remove('hide'); }
      const ctx = liff.getContext() || {};
      state.canSend = liff.isInClient() && ['utou', 'group', 'room', 'square_chat'].includes(ctx.type);
      $('btn-send').classList.toggle('hide', !state.canSend);
      $('status').classList.add('hide');
      $('app').classList.remove('hide');
      updateSize();
      loadList();
    }

    // ---------- เรียก Apps Script ----------
    async function freshToken() {
      const d = liff.getDecodedIDToken();
      if (!d || d.exp * 1000 < Date.now() + 60000) {
        await Swal.fire({ icon: 'info', title: 'เซสชัน LINE หมดอายุ', text: 'กดตกลงเพื่อเข้าสู่ระบบใหม่', confirmButtonText: 'ตกลง' });
        if (liff.isInClient()) location.reload(); else { liff.logout(); liff.login({ redirectUri: location.href }); }
        throw new Error('กำลังเข้าสู่ระบบใหม่');
      }
      return liff.getIDToken();
    }

    async function api(q, params, needAuth = true) {
      const body = new URLSearchParams(Object.assign({ q }, params || {}));
      if (needAuth) body.set('token', await freshToken());
      let res;
      try {
        res = await fetch(CFG.SCRIPT_URL, { method: 'POST', body });
      } catch (e) {
        throw new Error('ติดต่อ Apps Script ไม่ได้ — เช็ก SCRIPT_URL (ต้องลงท้าย /exec) และตอน Deploy ต้องเลือก "ผู้ที่มีสิทธิ์เข้าถึง: ทุกคน"');
      }
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch (e) {
        throw new Error('Apps Script ตอบกลับไม่ใช่ JSON (HTTP ' + res.status + ') — มักเป็นเพราะ Deploy ไม่ได้ตั้ง "ทุกคน" หรือยังไม่ได้ Deploy เวอร์ชันใหม่');
      }
      if (data.result === 'error') throw new Error(data.message || 'เกิดข้อผิดพลาด');
      return data;
    }

    // ---------- JSON ในช่องแก้ไข ----------
    function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    function bytes(s) { return new TextEncoder().encode(s).length; }

    function readMessage(silent) {
      const raw = $('json').value.trim();
      const fail = (msg) => { if (!silent) Swal.fire({ icon: 'error', title: 'JSON ไม่ถูกต้อง', text: msg }); return null; };
      if (!raw) return fail('วาง JSON ของ Flex ก่อน');
      let obj;
      try { obj = JSON.parse(raw); } catch (e) { return fail(e.message); }
      if (Array.isArray(obj)) obj = obj[0];
      if (obj && Array.isArray(obj.messages)) obj = obj.messages[0];
      let msg;
      if (obj && obj.type === 'flex' && obj.contents) msg = Object.assign({}, obj);
      else if (obj && (obj.type === 'bubble' || obj.type === 'carousel')) msg = { type: 'flex', altText: '', contents: obj };
      else return fail('ต้องเป็น Flex: "type" ต้องเป็น bubble, carousel หรือ flex');
      msg.altText = ($('altText').value.trim() || msg.altText || 'FLEX MESSAGE').slice(0, 400);
      return msg;
    }

    function writeEditor(msg) {
      const extra = Object.keys(msg).some((k) => !['type', 'altText', 'contents'].includes(k));
      $('altText').value = msg.altText || '';
      $('json').value = JSON.stringify(extra ? msg : msg.contents, null, 2);
      updateSize();
    }

    function updateSize() {
      const msg = readMessage(true);
      if (!msg) { $('size').textContent = ''; return; }
      const kb = bytes(JSON.stringify(msg.contents)) / 1024;
      const limit = msg.contents.type === 'carousel' ? 50 : 30;
      $('size').textContent = msg.contents.type + ' ' + kb.toFixed(1) + ' / ' + limit + ' KB';
      $('size').className = kb > limit ? 'text-danger fw-bold' : 'text-muted';
    }

    function shareUrl(id) { return 'https://liff.line.me/' + CFG.LIFF_ID + '?flex=' + encodeURIComponent(id); }

    // แทน {{sharedFlex}} ด้วยลิงก์แชร์ (ต้องบันทึกก่อนถึงจะมีลิงก์)
    function withShareLink(msg, id) {
      const s = JSON.stringify(msg);
      if (s.indexOf('{{sharedFlex}}') < 0) return msg;
      if (!id) {
        Swal.fire({ icon: 'warning', title: 'ต้องบันทึกก่อน', text: 'Flex นี้มี {{sharedFlex}} — กด "บันทึก" ก่อนจึงจะแชร์ได้' });
        return null;
      }
      return JSON.parse(s.split('{{sharedFlex}}').join(shareUrl(id)));
    }

    // ---------- ส่ง / แชร์ ----------
    async function sendShare(msg) {
      if (!liff.isApiAvailable('shareTargetPicker')) {
        return Swal.fire({ icon: 'error', title: 'แชร์ไม่ได้', text: 'เปิด "shareTargetPicker" ใน LINE Developers > LIFF ก่อน (หรือเวอร์ชัน LINE เก่าเกินไป)' });
      }
      try {
        const r = await liff.shareTargetPicker([msg], { isMultiple: true });
        if (r) Toast.fire({ icon: 'success', title: 'ส่งข้อความสำเร็จ' });
      } catch (e) {
        Swal.fire({ icon: 'error', title: 'ส่งไม่สำเร็จ', text: e.message || String(e) });
      }
    }

    async function sendInChat(msg) {
      try {
        await liff.sendMessages([msg]);
        await Swal.fire({ icon: 'success', title: 'ส่งข้อความสำเร็จ', showConfirmButton: false, timer: 1200 });
        liff.closeWindow();
      } catch (e) {
        Swal.fire({ icon: 'error', title: 'ส่งไม่สำเร็จ', text: e.message || String(e) });
      }
    }

    function preview(msg) {
      const data = JSON.stringify(msg).replace(/</g, '\\u003c');
      $('previewFrame').srcdoc = '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
        '<link rel="stylesheet" href="' + F2H + '/css/flex2html.css"><style>html,body{background:#849ebf!important}.chatbox{width:auto;padding:16px 8px}</style></head>' +
        '<body><div class="chatbox"><div id="flex1"></div></div><script src="' + F2H + '/js/flex2html.min.js"><\/script>' +
        '<script>try{flex2html("flex1",' + data + ')}catch(e){document.body.innerHTML="<p style=\\"padding:16px;color:#fff\\">แสดงตัวอย่างไม่ได้: "+e.message+"</p>"}<\/script></body></html>';
      bootstrap.Modal.getOrCreateInstance($('previewModal')).show();
    }

    // ---------- รายการที่บันทึก ----------
    async function loadList() {
      $('list').innerHTML = '<div class="text-muted small"><span class="spinner-border spinner-border-sm"></span> กำลังโหลดรายการ...</div>';
      $('list-empty').classList.add('hide');
      try {
        const r = await api('get');
        state.items = (r.data || []).slice().reverse();
        renderList();
      } catch (e) {
        $('list').innerHTML = '';
        const p = document.createElement('div');
        p.className = 'alert alert-danger small';
        p.textContent = 'โหลดรายการไม่สำเร็จ: ' + e.message;
        $('list').appendChild(p);
      }
    }

    function renderList() {
      const list = $('list');
      list.innerHTML = '';
      $('count').textContent = state.items.length || '';
      $('list-empty').classList.toggle('hide', state.items.length > 0);
      state.items.forEach((it) => {
        const col = document.createElement('div');
        col.className = 'col-12 col-md-6';
        const card = document.createElement('div');
        card.className = 'card item-card h-100' + (it.id === state.editingId ? ' editing' : '');
        const body = document.createElement('div');
        body.className = 'card-body p-2';
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = it.name;
        const meta = document.createElement('div');
        meta.className = 'meta mb-1';
        meta.textContent = it.updated ? 'แก้ล่าสุด ' + new Date(it.updated).toLocaleString('th-TH') : '';
        const row = document.createElement('div');
        row.className = 'btn-row';
        const buttons = [
          ['edit', 'btn-outline-primary', 'เปิดแก้ไข'],
          state.canSend ? ['send', 'btn-outline-warning', 'ส่งในแชทนี้'] : null,
          ['share', 'btn-outline-success', 'แชร์'],
          ['preview', 'btn-outline-info', 'ตัวอย่าง'],
          ['link', 'btn-outline-secondary', 'คัดลอกลิงก์แชร์'],
          ['delete', 'btn-outline-danger', 'ลบ'],
        ].filter(Boolean);
        buttons.forEach(([act, cls, label]) => {
          const b = document.createElement('button');
          b.className = 'btn btn-sm ' + cls + ' me-1';
          b.dataset.act = act;
          b.dataset.id = it.id;
          b.textContent = label;
          row.appendChild(b);
        });
        body.append(name, meta, row);
        card.appendChild(body);
        col.appendChild(card);
        list.appendChild(col);
      });
    }

    function itemMsg(it) {
      try { return JSON.parse(it.flex); } catch (e) { Swal.fire({ icon: 'error', title: 'ข้อมูลรายการนี้เสีย' }); return null; }
    }

    function setEditing(it) {
      state.editingId = it ? it.id : null;
      $('editing-bar').classList.toggle('hide', !it);
      $('btn-update').classList.toggle('hide', !it);
      $('btn-save').textContent = it ? 'บันทึกเป็นรายการใหม่' : 'บันทึก';
      $('editing-name').textContent = it ? it.name : '';
      renderList();
    }

    function busy(title) {
      Swal.fire({ title, allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    }

    // ---------- ปุ่มในรายการ (ผูกครั้งเดียว ไม่ซ้อนกัน) ----------
    $('list').addEventListener('click', async (ev) => {
      const b = ev.target.closest('button[data-act]');
      if (!b) return;
      const it = state.items.find((x) => x.id === b.dataset.id);
      if (!it) return;
      const act = b.dataset.act;
      if (act === 'edit') {
        const msg = itemMsg(it); if (!msg) return;
        writeEditor(msg);
        setEditing(it);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else if (act === 'send' || act === 'share') {
        const msg = itemMsg(it); if (!msg) return;
        act === 'send' ? sendInChat(msg) : sendShare(msg);
      } else if (act === 'preview') {
        const msg = itemMsg(it); if (msg) preview(msg);
      } else if (act === 'link') {
        try { await navigator.clipboard.writeText(shareUrl(it.id)); Toast.fire({ icon: 'success', title: 'คัดลอกลิงก์แล้ว' }); }
        catch (e) { Swal.fire({ title: 'ลิงก์แชร์', input: 'text', inputValue: shareUrl(it.id) }); }
      } else if (act === 'delete') {
        const ok = await Swal.fire({
          icon: 'warning', title: 'ลบ "' + it.name + '" ?', text: 'ลบแล้วกู้คืนไม่ได้',
          showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'ลบ', cancelButtonText: 'ยกเลิก',
        });
        if (!ok.isConfirmed) return;
        busy('กำลังลบ...');
        try {
          await api('delete', { id: it.id });
          state.items = state.items.filter((x) => x.id !== it.id);
          if (state.editingId === it.id) setEditing(null); else renderList();
          Toast.fire({ icon: 'success', title: 'ลบแล้ว' });
        } catch (e) {
          Swal.fire({ icon: 'error', title: 'ลบไม่สำเร็จ', text: e.message });
        }
      }
    });

    // ---------- ปุ่มของช่องแก้ไข ----------
    $('json').addEventListener('input', updateSize);
    $('altText').addEventListener('input', updateSize);
    $('btn-reload').addEventListener('click', loadList);
    $('btn-new').addEventListener('click', () => { $('json').value = ''; $('altText').value = ''; updateSize(); setEditing(null); });

    $('btn-preview').addEventListener('click', () => {
      const msg = readMessage(); if (msg) preview(msg);
    });
    $('btn-share').addEventListener('click', () => {
      const msg = readMessage(); if (!msg) return;
      const m = withShareLink(msg, state.editingId); if (m) sendShare(m);
    });
    $('btn-send').addEventListener('click', () => {
      const msg = readMessage(); if (!msg) return;
      const m = withShareLink(msg, state.editingId); if (m) sendInChat(m);
    });

    $('btn-save').addEventListener('click', async () => {
      const msg = readMessage(); if (!msg) return;
      const r = await Swal.fire({
        title: 'ตั้งชื่อ Flex',
        input: 'text',
        inputValue: msg.altText !== 'FLEX MESSAGE' ? msg.altText.slice(0, 100) : '',
        inputAttributes: { maxlength: 100, autocapitalize: 'off' },
        showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก',
        showLoaderOnConfirm: true,
        allowOutsideClick: () => !Swal.isLoading(),
        preConfirm: async (name) => {
          name = (name || '').trim();
          if (!name) { Swal.showValidationMessage('กรุณาใส่ชื่อ'); return false; }
          try {
            const out = await api('put', { name, flex: JSON.stringify(msg) });
            if (out.result === 'duplicate') { Swal.showValidationMessage('ชื่อนี้มีแล้ว — ใช้ชื่ออื่น หรือกด "เปิดแก้ไข" ที่รายการเดิมแล้วกด "อัปเดต"'); return false; }
            return out.data;
          } catch (e) { Swal.showValidationMessage('บันทึกไม่สำเร็จ: ' + e.message); return false; }
        },
      });
      if (!r.isConfirmed || !r.value) return;
      state.items.unshift(r.value);
      const saved = itemMsg(r.value); if (saved) writeEditor(saved);
      setEditing(r.value);
      Swal.fire({ icon: 'success', title: 'บันทึกเรียบร้อย', showConfirmButton: false, timer: 1300 });
    });

    $('btn-update').addEventListener('click', async () => {
      const id = state.editingId; if (!id) return;
      const msg = readMessage(); if (!msg) return;
      busy('กำลังอัปเดต...');
      try {
        const out = await api('update', { id, flex: JSON.stringify(msg) });
        const i = state.items.findIndex((x) => x.id === id);
        if (i > -1) state.items[i] = out.data;
        const saved = itemMsg(out.data); if (saved) writeEditor(saved);
        setEditing(out.data);
        Swal.fire({ icon: 'success', title: 'อัปเดตเรียบร้อย', showConfirmButton: false, timer: 1300 });
      } catch (e) {
        Swal.fire({ icon: 'error', title: 'อัปเดตไม่สำเร็จ', text: e.message });
      }
    });

    // ---------- โหมดแชร์ (เปิดจากลิงก์ ?flex=ID) ----------
    async function shareMode(id) {
      showStatus('กำลังเปิด Flex ที่แชร์...', true);
      try {
        const r = await api('one', { id }, false);
        const msg = JSON.parse(r.data.flex);
        const go = async () => {
          if (!liff.isApiAvailable('shareTargetPicker')) throw new Error('LINE เวอร์ชันนี้แชร์ไม่ได้');
          const res = await liff.shareTargetPicker([msg], { isMultiple: true });
          if (res && liff.isInClient()) return liff.closeWindow();
          showStatus((res ? '<b>ส่งข้อความสำเร็จ</b><br>' : '') +
            '<button class="btn linebg mt-2" id="again">แชร์อีกครั้ง</button>');
          $('again').onclick = () => go().catch((e) => showStatus('แชร์ไม่สำเร็จ: ' + esc(e.message)));
        };
        await go().catch((e) => {
          showStatus('<b>แชร์ไม่สำเร็จ</b><br><small>' + esc(e.message || e) + '</small><br><button class="btn linebg mt-2" id="again">ลองอีกครั้ง</button>');
          $('again').onclick = () => go().catch((err) => showStatus('แชร์ไม่สำเร็จ: ' + esc(err.message)));
        });
      } catch (e) {
        showStatus('<b>เปิด Flex ที่แชร์ไม่สำเร็จ</b><br><small>' + esc(e.message || e) + '</small>');
      }
    }

    main();
  </script>
</body>
